# =============================================================================
# Helm Service Template — Educational Reference
# =============================================================================
#
# What:
#   A Kubernetes Service manifest driven entirely by values, so a single chart
#   can expose the application as ClusterIP, NodePort, or LoadBalancer
#   without touching the template — just change values.yaml or pass --set.
#
# Values wired in this template:
#   .Values.service.type       → ClusterIP | NodePort | LoadBalancer
#   .Values.service.port       → port advertised on the Service (e.g. 80)
#   .Values.service.targetPort → port the nginx container actually listens on
#
# Template technique — conditional block:
#   {{- if eq .Values.service.type "NodePort" }}
#     nodePort: 30080           # line is only rendered when type=NodePort
#   {{- end }}
#   The eq function compares two values. {{- trims leading whitespace so no
#   blank lines appear in the rendered output when the block is skipped.
#
# Service type comparison:
#   ┌─────────────────┬─────────────────────────────────────────────────────┐
#   │ Type            │ Accessibility                                       │
#   ├─────────────────┼─────────────────────────────────────────────────────┤
#   │ ClusterIP       │ Internal only — Pods within the cluster             │
#   │ NodePort        │ External via <NodeIP>:<nodePort> (30000–32767)      │
#   │ LoadBalancer    │ External via cloud load balancer (cloud clusters)   │
#   └─────────────────┴─────────────────────────────────────────────────────┘
#
# See also:
#   - 01-chart-basics/Chart.yaml  for overall Helm concepts and CLI cheatsheet
#   - 01-chart-basics/values.yaml for the service section defaults
#   - 02-templates/deployment.yaml for full Go-template syntax reference
#
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx          # matches the Deployment name prefix
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}         # ClusterIP | NodePort | LoadBalancer
  selector:
    app: {{ .Chart.Name }}                 # must match the Pod template labels
    release: {{ .Release.Name }}           # scopes selector to this release only
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}           # port exposed on the Service
      targetPort: {{ .Values.service.targetPort }} # port the container listens on
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: 30080                            # static NodePort (only rendered when type=NodePort)
      {{- end }}

# Verify:
#   kubectl get svc -n <namespace>
#   kubectl describe svc my-nginx-nginx -n <namespace>
#
# Access via ClusterIP (from within the cluster):
#   kubectl run tmp --image=busybox --rm -it -- wget -qO- http://my-nginx-nginx
#
# Access via NodePort (from outside the cluster):
#   kubectl get nodes -o wide              # grab a Node IP
#   curl http://<NODE_IP>:30080
#
# Switch type at upgrade (no template edits required):
#   helm upgrade my-nginx ./nginx-demo --set service.type=LoadBalancer
#
# Render locally to preview:
#   helm template my-nginx ./nginx-demo --set service.type=NodePort
