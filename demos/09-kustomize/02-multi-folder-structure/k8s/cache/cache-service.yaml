# =============================================================================
# Redis Service — Cache Component
# =============================================================================
#
# ClusterIP only — the cache is an internal service.
# After root namePrefix: myapp-cache-service
# Reachable from other Pods at: myapp-cache-service:6379
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: cache-service          # Root kustomization will prefix this: myapp-cache-service
spec:
  type: ClusterIP
  selector:
    app: cache
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
