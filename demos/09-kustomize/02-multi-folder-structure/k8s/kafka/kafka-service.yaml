# =============================================================================
# Kafka Service — Messaging Component
# =============================================================================
#
# Port 9092 is the standard Kafka broker port for client connections.
# After root namePrefix: myapp-kafka-service
# Producers/consumers connect at: myapp-kafka-service:9092
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: kafka-service          # Root kustomization will prefix this: myapp-kafka-service
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
  - name: broker
    protocol: TCP
    port: 9092
    targetPort: 9092
  - name: controller
    protocol: TCP
    port: 9093
    targetPort: 9093
