# =============================================================================
# Kustomize — Kafka Component (kafka/)
# =============================================================================
#
# This sub-kustomization manages the Kafka messaging resources.
# It can be deployed independently or composed by the root kustomization.
#
# Filter Kafka resources after deploy:
#   kubectl get all -l component=kafka
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kafka-depl.yaml
  - kafka-service.yaml

commonLabels:
  component: kafka
