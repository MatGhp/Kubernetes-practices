# =============================================================================
# REST API Service — API Component
# =============================================================================
#
# LoadBalancer type exposes the API externally.
# For local/dev clusters (minikube), use:
#   minikube service myapp-api-service --url
#   or port-forward: kubectl port-forward svc/myapp-api-service 8080:80
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: api-service            # Root kustomization will prefix this: myapp-api-service
spec:
  type: LoadBalancer           # External access for the REST API
  selector:
    app: api                   # Routes to Pods with label app=api
  ports:
  - name: http
    protocol: TCP
    port: 80                   # External port
    targetPort: 8080           # Container port
